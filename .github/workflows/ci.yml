name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # New OS-level CVEs (like the util-linux one found while building this)
    # get disclosed continuously, independent of whether this repo's code
    # changes. A container that scanned clean last month isn't necessarily
    # clean today. Re-scan weekly so a newly-disclosed base-image CVE gets
    # caught even during a quiet week with no pushes.
    - cron: "0 6 * * 1" # Monday 06:00 UTC

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------
  # 1. Lint -- fast feedback, fails the build on style/correctness issues
  # ---------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check app/ scripts/ tests/

  # ---------------------------------------------------------------------
  # 2. Unit / integration tests with coverage (SQLite, the default dev DB)
  # ---------------------------------------------------------------------
  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          ENVIRONMENT: development
          FORCE_HTTPS: "false"
          TRUSTED_HOSTS: "testserver,127.0.0.1,localhost"
        run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------
  # 2b. Same suite again against real Postgres -- this is the path used in
  #     production (e.g. Supabase), so it gets its own CI verification
  #     rather than trusting that "works on SQLite" implies "works on PG".
  # ---------------------------------------------------------------------
  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credtrace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Apply migrations
        env:
          ENVIRONMENT: production
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/credtrace_ci"
          SECRET_KEY: "ci-only-key-not-a-real-secret-0123456789abcdef"
        run: alembic upgrade head
      - name: Run tests
        env:
          ENVIRONMENT: development # exercise the app's normal request path, not startup's create_all
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/credtrace_ci"
          FORCE_HTTPS: "false"
          TRUSTED_HOSTS: "testserver,127.0.0.1,localhost"
        run: pytest tests/ -v

  # ---------------------------------------------------------------------
  # 2c. Migrations -- catch model/migration drift before it ships
  # ---------------------------------------------------------------------
  migrations:
    name: Verify migrations apply cleanly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - name: Upgrade to head, then downgrade to base, against a throwaway DB
        env:
          ENVIRONMENT: development
          DATABASE_URL: "sqlite:///./ci_migration_check.db"
        run: |
          alembic upgrade head
          alembic downgrade base
      - name: Fail if models changed without a matching migration
        env:
          ENVIRONMENT: development
          DATABASE_URL: "sqlite:///./ci_migration_check_autogen.db"
        run: |
          alembic upgrade head
          alembic check

  # ---------------------------------------------------------------------
  # 3. SAST -- static analysis for security issues in our own code
  # ---------------------------------------------------------------------
  sast-bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r app/ scripts/ -c pyproject.toml -f json -o bandit-report.json
      - run: bandit -r app/ scripts/ -c pyproject.toml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  sast-semgrep:
    name: SAST (semgrep, broad ruleset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/python
        continue-on-error: true # informational: broader ruleset, tune before enforcing

  # ---------------------------------------------------------------------
  # 4. Software Composition Analysis -- known CVEs in our dependencies
  # ---------------------------------------------------------------------
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------
  # 5. Secret scanning -- catch committed credentials before they merge
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan all commits in the PR
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------
  # 6. Container build + image vulnerability scan
  # ---------------------------------------------------------------------
  container-scan:
    name: Build & scan container image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: credtrace:ci
          load: true
      - name: Scan image with Trivy
        # Pinned to the v-prefixed tag deliberately: in March 2026,
        # attackers compromised aquasecurity/trivy-action by force-pushing
        # malicious code onto 76 of 77 *tag* references (a real supply-chain
        # attack, not a hypothetical one -- see
        # https://github.com/aquasecurity/trivy/security/advisories/GHSA-69fq-xp46-6x23).
        # Their fix was to re-publish all tags with a `v` prefix pointing at
        # the verified-legitimate commits, so `v0.36.0` here is meaningfully
        # different from (and safer than) an old bare `0.28.0`-style tag.
        # For a real production pipeline, pin to the exact commit SHA
        # instead of any tag -- tags can be moved, commit SHAs cannot.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: credtrace:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.17.0
        with:
          image: credtrace:ci
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json

  # ---------------------------------------------------------------------
  # 7. DAST -- black-box scan of the actually-running app (informational
  #    to start; promote to blocking once you've triaged the baseline)
  # ---------------------------------------------------------------------
  dast-zap-baseline:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [container-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: credtrace:ci
          load: true
      - name: Run app for scanning
        run: |
          docker run -d --name credtrace-scan-target -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e FORCE_HTTPS=false \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e TRUSTED_HOSTS=localhost,127.0.0.1 \
            -e DATABASE_URL=sqlite:////tmp/credtrace.db \
            credtrace:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/healthz && break
            sleep 2
          done
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          cmd_options: "-a"
        continue-on-error: true # informational: triage findings before making this blocking
      - if: always()
        run: docker logs credtrace-scan-target || true
