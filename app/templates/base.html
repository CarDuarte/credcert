<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CredTrace{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">&gt;_</span>
        <span class="brand-name">CredTrace</span>
      </div>
      <nav class="nav">
        <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Dashboard</a>
        <a href="/credentials" class="{{ 'active' if request.url.path.startswith('/credentials') else '' }}">Credentials</a>
        <a href="/projects" class="{{ 'active' if request.url.path.startswith('/projects') else '' }}">Projects</a>
        {% if user.role.value == 'admin' %}
        <a href="/users" class="{{ 'active' if request.url.path.startswith('/users') else '' }}">Users</a>
        <a href="/audit" class="{{ 'active' if request.url.path.startswith('/audit') else '' }}">Audit log</a>
        {% endif %}
      </nav>
      <div class="sidebar-footer">
        <div class="whoami">
          <span class="dot"></span>
          <div>
            <div class="username">{{ user.username }}</div>
            <div class="role">{{ user.role.value }}</div>
          </div>
        </div>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
          <button type="submit" class="link-button">Sign out</button>
        </form>
      </div>
    </aside>
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% else %}
  {% block bare_content %}{% endblock %}
  {% endif %}
</body>
</html>
