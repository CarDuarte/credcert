[project]
name = "credtrace"
version = "0.1.0"
description = "Credential usage / blast-radius tracker. Metadata only -- never stores secret values."
requires-python = ">=3.12"
# Deliberately duplicated from requirements.txt, not generated from it.
#
# Why this duplication exists: Vercel's Python build pipeline (uv-based,
# as of the 48.2.0-era build system) prioritizes pyproject.toml's
# `dependencies` over requirements.txt the moment a `[project]` table is
# present -- even an empty one silently installs *nothing* and ignores
# requirements.txt entirely, which is what broke the first Vercel deploy
# of this project (ModuleNotFoundError: No module named 'fastapi').
# requirements.txt stays authoritative for Docker/CI (both already
# reference it directly, and it's what get pinned via `pip freeze` /
# fresh-venv-tested against). This list mirrors it for Vercel's benefit.
# The `check-deps-in-sync` CI job fails the build if these two drift.
dependencies = [
    "alembic==1.19.1",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "argon2-cffi==25.1.0",
    "argon2-cffi-bindings==25.1.0",
    "cffi==2.1.1",
    "click==8.4.2",
    "Deprecated==1.3.1",
    "fastapi==0.141.1",
    "greenlet==3.5.5",
    "h11==0.16.0",
    "httptools==0.8.0",
    "idna==3.18",
    "Jinja2==3.1.6",
    "limits==5.8.0",
    "Mako==1.4.1",
    "MarkupSafe==3.0.3",
    "packaging==26.3",
    "passlib==1.7.4",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "slowapi==0.1.10",
    "SQLAlchemy==2.0.52",
    "starlette==1.6.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.52.3",
    "uvloop==0.22.1; sys_platform != 'win32'",
    "watchfiles==1.2.0",
    "websockets==17.0.1",
    "wrapt==2.3.0",
]

[tool.vercel]
# Vercel's Python runtime looks for a FastAPI `app` instance at a handful
# of conventional root-level paths (app.py, main.py, index.py, ...) by
# default. Ours lives at app/main.py instead, so it needs to be pointed
# there explicitly rather than restructuring the project around Vercel's
# convention. Format is Python's dotted module path + ":" + the variable
# name
entrypoint = "app.main:app"

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "S",   # flake8-bandit (security lint rules, in addition to the standalone bandit CI job)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "S101",  # assert usage (fine in tests, and we don't ship without tests)
    "B008",  # `Depends(...)` in a function default is FastAPI's standard dependency-injection idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]  # asserts + hardcoded test credentials are expected in tests
"scripts/seed.py" = ["S106"]  # this script's whole job is to accept a password via env var

[tool.bandit]
exclude_dirs = [".venv", "tests"]
# B101 (assert) excluded globally by Bandit's own default skip list already.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::DeprecationWarning:fastapi.testclient",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/templating.py"]
